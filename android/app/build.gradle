plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opgeotech.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opgeotech.app'
        minSdk 23
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
