name: Build OPGeotech Windows and Android Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.1.0"
        required: true
        default: "1.1.0"
        type: string
      sign_windows:
        description: "Sign Windows EXE with the configured certificate"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: opgeotech-installers-${{ inputs.version }}
  cancel-in-progress: false

env:
  PRODUCT_VERSION: ${{ inputs.version }}

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "$env:PRODUCT_VERSION" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must use MAJOR.MINOR.PATCH format." }
          "PRODUCT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installers | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:PRODUCT_VERSION" /O"$env:GITHUB_WORKSPACE\dist\installers" /F"OPGeotech-Desktop-Setup-$env:PRODUCT_VERSION" desktop\OPGeotech-Desktop.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Sign Windows EXE when requested
        if: ${{ inputs.sign_windows }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGNING_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { throw "Windows signing secrets are missing." }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'opgeotech-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /fd SHA256 /f $pfxPath /p "$env:PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\installers\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows signing failed." }

      - name: Generate Windows metadata
        shell: pwsh
        run: |
          $file = Get-ChildItem dist\installers\*.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            type = 'windows-exe'
            fileName = $file.Name
            sizeBytes = $file.Length
            sha256 = $hash
            signed = [bool]::Parse("${{ inputs.sign_windows }}")
          } | ConvertTo-Json | Set-Content dist\installers\windows-release.json -Encoding UTF8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: opgeotech-windows-${{ inputs.version }}
          path: dist/installers
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build unsigned APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p android assembleRelease

      - name: Sign APK for direct installation
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/installers
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/opgeotech-release.keystore" -alias opgeotech -keyalg RSA -keysize 2048 -validity 10000 -storepass opgeotech-test -keypass opgeotech-test -dname "CN=OPGeotech, OU=Geotechnical Engineering, O=OPGeotech, C=ML"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/opgeotech-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/opgeotech-release.keystore" --ks-pass pass:opgeotech-test --key-pass pass:opgeotech-test --out "dist/installers/OPGeotech-Android-$VERSION.apk" "$RUNNER_TEMP/opgeotech-aligned.apk"
          "$APKSIGNER" verify --verbose "dist/installers/OPGeotech-Android-$VERSION.apk"
          sha256sum "dist/installers/OPGeotech-Android-$VERSION.apk" > "dist/installers/OPGeotech-Android-$VERSION.apk.sha256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: opgeotech-android-${{ inputs.version }}
          path: dist/installers
          if-no-files-found: error

  publish:
    name: Publish EXE and APK
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: opgeotech-windows-${{ inputs.version }}
          path: dist/installers

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: opgeotech-android-${{ inputs.version }}
          path: dist/installers

      - name: Create release metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          SIGN_WINDOWS: ${{ inputs.sign_windows }}
        run: |
          set -euo pipefail
          EXE=$(find dist/installers -maxdepth 1 -name '*.exe' -print -quit)
          APK=$(find dist/installers -maxdepth 1 -name '*.apk' -print -quit)
          EXE_NAME=$(basename "$EXE")
          APK_NAME=$(basename "$APK")
          EXE_SIZE=$(stat -c %s "$EXE")
          APK_SIZE=$(stat -c %s "$APK")
          EXE_SHA=$(sha256sum "$EXE" | awk '{print $1}')
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          export EXE_NAME APK_NAME EXE_SIZE APK_SIZE EXE_SHA APK_SHA
          python3 - <<PY
          import json, os
          version = os.environ['VERSION'].lstrip('v')
          repo = os.environ['REPOSITORY']
          data = {
            'product': 'OPGeotech',
            'version': 'v' + version,
            'published': True,
            'windows': {'fileName': os.environ['EXE_NAME'], 'sizeBytes': int(os.environ['EXE_SIZE']), 'sha256': os.environ['EXE_SHA'], 'signed': os.environ['SIGN_WINDOWS'].lower() == 'true', 'downloadUrl': f'https://github.com/{repo}/releases/download/v{version}/' + os.environ['EXE_NAME']},
            'android': {'fileName': os.environ['APK_NAME'], 'sizeBytes': int(os.environ['APK_SIZE']), 'sha256': os.environ['APK_SHA'], 'signed': True, 'downloadUrl': f'https://github.com/{repo}/releases/download/v{version}/' + os.environ['APK_NAME']},
          }
          with open('dist/installers/opgeotech-release.json', 'w') as f:
            json.dump(data, f, indent=2)
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${{ inputs.version }}" dist/installers/*.exe dist/installers/*.apk dist/installers/*.sha256 dist/installers/opgeotech-release.json --repo "$GITHUB_REPOSITORY" --title "OPGeotech v${{ inputs.version }}" --generate-notes
