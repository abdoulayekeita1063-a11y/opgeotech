name: Build OPGeotech Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        default: "1.0.0"
        type: string
      verify_signature:
        description: "Verify Authenticode trust chain (disable for self-signed test certificates)"
        required: true
        default: false
        type: boolean
      sign_installers:
        description: "Sign installers with the configured PFX certificate"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-windows-installers:
    name: Build signed EXE and MSI
    runs-on: windows-2022
    # To use a private Windows machine instead, replace the line above with:
    # runs-on: [self-hosted, windows, x64, opgeotech-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "$env:PRODUCT_VERSION" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use MAJOR.MINOR.PATCH format. Received: $version"
          }
          "PRODUCT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRODUCT_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # WiX 4 matches the v4 WXS schema and does not require the WiX 6/7 OSMF acknowledgement.
          dotnet tool install --global wix --version 4.0.5
          wix --version

      - name: Prepare output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installers | Out-Null

      - name: Build EXE with Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found." }
          & $iscc "/DAppVersion=$env:PRODUCT_VERSION" `
            /O"$env:GITHUB_WORKSPACE\dist\installers" `
            /F"OPGeotech-Desktop-Setup-$env:PRODUCT_VERSION" `
            desktop\OPGeotech-Desktop.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Build MSI with WiX
        shell: pwsh
        run: |
          wix build -arch x64 `
            -d ProductVersion=$env:PRODUCT_VERSION `
            desktop\OPGeotech-Desktop.wxs `
            -o "dist\installers\OPGeotech-Desktop-$env:PRODUCT_VERSION.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed." }

      - name: Import Authenticode certificate
        if: ${{ inputs.sign_installers }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGNING_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "Add WINDOWS_CODESIGNING_PFX_B64 and WINDOWS_CODESIGNING_PFX_PASSWORD before publishing production installers."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'opgeotech-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
          $securePassword = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword
          "SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign and optionally verify EXE/MSI
        if: ${{ inputs.sign_installers }}
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGNING_PFX_PASSWORD }}
          VERIFY_SIGNATURE: ${{ inputs.verify_signature }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'opgeotech-signing.pfx'
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          Get-ChildItem dist\installers\*.exe, dist\installers\*.msi | ForEach-Object {
            & $signtool sign /fd SHA256 /f $pfxPath /p "$env:PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)." }
            if ($env:VERIFY_SIGNATURE -eq "true") {
              & $signtool verify /pa /all $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($_.Name)." }
            } else {
              Write-Host "Trust-chain verification skipped for $($_.Name) (test certificate mode)."
            }
          }

      - name: Generate release metadata and checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\installers\*.exe, dist\installers\*.msi
          $artifacts = @{}
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $type = if ($file.Extension -eq '.exe') { 'exe' } else { 'msi' }
            $artifacts[$type] = [ordered]@{
              fileName = $file.Name
              sizeBytes = $file.Length
              size = "{0:N1} MB" -f ($file.Length / 1MB)
              sha256 = $hash
              signed = [bool]::Parse("${{ inputs.sign_installers }}")
              downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:PRODUCT_VERSION/$($file.Name)"
            }
          }
          $metadata = [ordered]@{
            product = 'OPGeotech Desktop'
            version = "v$env:PRODUCT_VERSION"
            published = $true
            architecture = 'Windows x64'
            releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:PRODUCT_VERSION"
            artifacts = $artifacts
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $metadata | ConvertTo-Json -Depth 6 | Set-Content dist\installers\desktop-release.json -Encoding UTF8
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($_.Name),$($_.Length),$hash"
          } | Set-Content dist\installers\release-metadata.csv -Encoding UTF8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPGeotech-Windows-Installers-${{ env.PRODUCT_VERSION }}
          path: dist/installers
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v$env:PRODUCT_VERSION" `
            dist\installers\*.exe `
            dist\installers\*.msi `
            dist\installers\desktop-release.json `
            dist\installers\release-metadata.csv `
            --title "OPGeotech Desktop v$env:PRODUCT_VERSION" `
            --generate-notes
